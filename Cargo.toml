[workspace]
resolver = "2"
members = [
    "crates/hermes-core",
    "crates/gateway",
    "crates/android-agent-fake",
    "crates/hermes-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kemomi/Hermes-Android"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
clap = { version = "4", features = ["derive"] }
hermes-core = { path = "crates/hermes-core" }

[profile.release]
lto = true
strip = true
